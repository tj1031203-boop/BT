<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은솔이에게 편지가 왔어요 💌</title>
<meta name="theme-color" content="#1b1446">
<meta property="og:title" content="💌 이은솔님에게 편지가 왔어요!">
<meta property="og:description" content="편지를 눌러 확인하세요 ✨">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #120c3a;
    --sky-mid: #3b2a7a;
    --sky-low: #b0659e;
    --sky-glow: #f6b38f;
    --gold: #ffd77a;
    --gold-deep: #e8a93c;
    --pink: #ff9ec7;
    --pink-deep: #e2638f;
    --paper: #fff8ec;
    --ink: #5a3d5c;
    --env: #ffd6e5;
    --env-shade: #f7b9d0;
    --env-dark: #eea2bf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 78%, var(--sky-glow) 100%);
    color: #fff;
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  }

  /* ---------- 배경: 별, 달, 등불, 성 ---------- */
  .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .star {
    position: absolute; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px 1px rgba(255,255,255,.8);
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
  }
  @keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }

  .moon {
    position: absolute; top: 7vh; right: 9vw; width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6, #ffe9a8 60%, #f5cf74);
    box-shadow: 0 0 40px 12px rgba(255,233,168,.45), 0 0 120px 40px rgba(255,233,168,.18);
  }

  .shooting {
    position: absolute; width: 120px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,255,255,0), #fff);
    transform: rotate(-25deg); opacity: 0;
    animation: shoot 7s linear infinite var(--delay, 0s);
  }
  @keyframes shoot {
    0% { opacity: 0; translate: 0 0; }
    3% { opacity: 1; }
    10% { opacity: 0; translate: -260px 120px; }
    100% { opacity: 0; translate: -260px 120px; }
  }

  .lantern {
    position: absolute; bottom: -40px; width: 14px; height: 18px; border-radius: 5px 5px 7px 7px;
    background: linear-gradient(180deg, #ffe7a3, #ffb347 60%, #f08a24);
    box-shadow: 0 0 14px 5px rgba(255,180,80,.55), 0 0 40px 10px rgba(255,160,60,.25);
    animation: rise var(--d, 18s) linear infinite var(--delay, 0s);
    opacity: 0;
  }
  @keyframes rise {
    0% { transform: translate(0, 0) scale(var(--s, 1)); opacity: 0; }
    8% { opacity: .95; }
    50% { transform: translate(var(--sway, 20px), -55vh) scale(var(--s, 1)); }
    90% { opacity: .8; }
    100% { transform: translate(0, -115vh) scale(calc(var(--s, 1) * .6)); opacity: 0; }
  }

  .castle { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: min(820px, 150vw); height: auto; }
  .castle .body { fill: #2a1d58; }
  .castle .win { fill: #ffd77a; filter: drop-shadow(0 0 4px #ffd77a); animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  .hills { position: absolute; bottom: 0; left: 0; width: 100%; height: 14vh; }

  /* ---------- 편지 무대 ---------- */
  .stage {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 16px 14vh; gap: 26px;
  }

  .bubble {
    position: relative; max-width: 330px; padding: 16px 22px;
    background: #fff; color: var(--ink); border-radius: 28px;
    font-family: "Jua", sans-serif; font-size: 19px; line-height: 1.45; text-align: center;
    box-shadow: 0 8px 0 rgba(226,99,143,.25), 0 14px 34px rgba(18,12,58,.45);
    border: 3px solid var(--pink);
    animation: bob 2.6s ease-in-out infinite, popIn .7s cubic-bezier(.2,1.6,.4,1) both;
  }
  .bubble b { color: var(--pink-deep); font-weight: normal; }
  .bubble small { display: block; font-size: 15px; color: #9b7a9c; margin-top: 2px; }
  .bubble::after, .bubble::before {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%); border-style: solid;
  }
  .bubble::before { bottom: -19px; border-width: 19px 15px 0; border-color: var(--pink) transparent transparent; }
  .bubble::after  { bottom: -14px; border-width: 15px 11px 0; border-color: #fff transparent transparent; }
  .bubble .spark { position: absolute; font-size: 18px; animation: twinkle 1.8s ease-in-out infinite; }
  .bubble .spark.a { top: -12px; left: -6px; }
  .bubble .spark.b { top: -14px; right: -4px; animation-delay: .6s; }
  .bubble .spark.c { bottom: -4px; right: 18px; animation-delay: 1.1s; font-size: 14px; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes popIn { from { opacity: 0; scale: .4; } to { opacity: 1; scale: 1; } }

  /* ---------- 봉투 ---------- */
  .envelope-wrap {
    position: relative; cursor: pointer; border: 0; background: none;
    animation: float 3.4s ease-in-out infinite;
    filter: drop-shadow(0 18px 26px rgba(18,12,58,.55));
  }
  .envelope-wrap:focus-visible { outline: 3px dashed var(--gold); outline-offset: 10px; border-radius: 12px; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
  .envelope-wrap::before {
    content: ""; position: absolute; inset: -30px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255,215,122,.45), transparent);
    animation: glow 2.4s ease-in-out infinite; z-index: -1;
  }

  .envelope { position: relative; width: min(290px, 78vw); aspect-ratio: 3 / 2; perspective: 900px; }
  .env-back {
    position: absolute; inset: 0; border-radius: 10px;
    background: linear-gradient(160deg, var(--env-shade), var(--env-dark));
  }
  .letter {
    position: absolute; left: 7%; right: 7%; top: 8%; height: 86%;
    background:
      repeating-linear-gradient(180deg, transparent 0 22px, rgba(226,99,143,.14) 22px 23px),
      var(--paper);
    border-radius: 6px; color: var(--ink); text-align: center;
    padding: 16px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: transform 1s cubic-bezier(.3,1.3,.5,1) .55s;
    z-index: 1;
  }
  .letter .to { font-family: "Jua", sans-serif; font-size: 17px; }
  .letter .hb { font-family: "Dancing Script", cursive; font-size: 28px; color: var(--pink-deep); margin-top: 6px; }
  .letter .heart { font-size: 20px; margin-top: 4px; }
  .env-front {
    position: absolute; inset: 0; border-radius: 0 0 10px 10px; z-index: 2;
    background: linear-gradient(180deg, var(--env), var(--env-shade));
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  }
  .env-front::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(to top right, transparent 49.5%, rgba(226,99,143,.25) 50%, transparent 51%) left bottom / 50% 100% no-repeat,
      linear-gradient(to top left, transparent 49.5%, rgba(226,99,143,.25) 50%, transparent 51%) right bottom / 50% 100% no-repeat;
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 62%; z-index: 3;
    background: linear-gradient(180deg, #ffe3ee, var(--env));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .7s ease-in-out, z-index 0s .35s;
  }
  .seal {
    position: absolute; left: 50%; top: 62%; z-index: 4;
    width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    display: grid; place-items: center; font-size: 22px; color: #fff;
    background: radial-gradient(circle at 35% 30%, #ff8fb4, #d6336c 70%);
    box-shadow: 0 0 0 4px rgba(214,51,108,.35), 0 4px 10px rgba(0,0,0,.25);
    transition: transform .4s ease, opacity .4s ease;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { scale: 1; } 50% { scale: 1.1; } }

  .tap-hint {
    font-family: "Jua", sans-serif; font-size: 15px; color: rgba(255,255,255,.85);
    letter-spacing: .5px; animation: glow 1.8s ease-in-out infinite;
  }

  /* 열렸을 때 */
  .opened .env-flap { transform: rotateX(180deg); z-index: 0; }
  .opened .seal { transform: scale(0) rotate(90deg); opacity: 0; animation: none; }
  .opened .letter { transform: translateY(-62%); }
  .opened.envelope-wrap { animation: none; cursor: default; }
  .stage.leaving .bubble, .stage.leaving .tap-hint { opacity: 0; transform: translateY(-20px); transition: all .5s ease; }
  .stage.leaving .envelope-wrap { transition: transform 1s ease 1.6s, opacity 1s ease 1.6s; transform: scale(1.25); opacity: 0; }

  /* 반짝이 터짐 */
  .burst { position: fixed; z-index: 5; pointer-events: none; font-size: var(--size, 18px);
    animation: burst 1.3s cubic-bezier(.1,.8,.3,1) forwards; }
  @keyframes burst {
    from { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--r)); opacity: 0; }
  }

  /* ---------- 영상 화면 ---------- */
  .movie {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px 16px;
    background: radial-gradient(ellipse at 50% 30%, rgba(59,42,122,.92), rgba(18,12,58,.97));
    opacity: 0; visibility: hidden; transition: opacity 1s ease, visibility 0s 1s;
  }
  .movie.show { opacity: 1; visibility: visible; transition: opacity 1s ease; }
  .movie h1 {
    font-family: "Dancing Script", cursive; font-size: clamp(34px, 9vw, 56px); line-height: 1.1; text-align: center;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255,215,122,.7), 0 0 30px rgba(255,158,199,.5);
  }
  .movie h1 span { display: block; font-family: "Jua", sans-serif; font-size: .45em; color: #ffe3ee; margin-top: 6px; }
  .frame {
    position: relative; width: min(720px, 100%); border-radius: 22px; padding: 6px;
    background: linear-gradient(135deg, var(--gold), var(--pink), #b9a2ff, var(--gold));
    box-shadow: 0 0 30px rgba(255,215,122,.45), 0 20px 50px rgba(0,0,0,.5);
  }
  .frame video, .frame .placeholder {
    display: block; width: 100%; max-height: 68vh; border-radius: 17px; background: #0d0a26;
  }
  .frame .placeholder {
    aspect-ratio: 16 / 9; display: none; place-items: center; text-align: center;
    font-family: "Jua", sans-serif; font-size: 18px; color: #ffe3ee; padding: 20px; line-height: 1.6;
  }
  .frame.missing video { display: none; }
  .frame.missing .placeholder { display: grid; }
  .play-big {
    position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.92); color: var(--pink-deep); font-size: 34px; cursor: pointer;
    box-shadow: 0 0 0 8px rgba(255,255,255,.25); display: none; padding-left: 6px;
  }
  .frame.needs-tap .play-big { display: block; }
  .again {
    font-family: "Jua", sans-serif; font-size: 16px; color: var(--ink); cursor: pointer;
    background: #fff; border: 0; border-radius: 999px; padding: 10px 20px;
    box-shadow: 0 4px 0 rgba(226,99,143,.35);
  }

  @media (max-height: 620px) {
    .stage { gap: 16px; padding-bottom: 10vh; }
    .bubble { font-size: 17px; padding: 12px 18px; }
    .moon { width: 46px; height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="moon"></div>
  <div id="stars"></div>
  <div class="shooting" style="top:14vh; left:78vw; --delay:2s"></div>
  <div class="shooting" style="top:6vh; left:45vw; --delay:5.5s"></div>
  <div id="lanterns"></div>

  <svg class="castle" viewBox="0 0 800 300" preserveAspectRatio="xMidYMax meet">
    <g class="body">
      <!-- 왼쪽 탑 -->
      <rect x="215" y="150" width="44" height="150"/>
      <polygon points="207,152 237,62 267,152"/>
      <rect x="236" y="40" width="2" height="24"/><polygon points="238,40 252,45 238,50"/>
      <!-- 오른쪽 탑 -->
      <rect x="541" y="150" width="44" height="150"/>
      <polygon points="533,152 563,62 593,152"/>
      <rect x="562" y="40" width="2" height="24"/><polygon points="564,40 578,45 564,50"/>
      <!-- 가운데 큰 탑 -->
      <rect x="360" y="95" width="80" height="205"/>
      <polygon points="348,98 400,-2 452,98"/>
      <rect x="399" y="-20" width="2" height="24"/><polygon points="401,-20 418,-14 401,-8"/>
      <!-- 중간 작은 탑 -->
      <rect x="300" y="135" width="36" height="165"/>
      <polygon points="293,138 318,75 343,138"/>
      <rect x="464" y="135" width="36" height="165"/>
      <polygon points="457,138 482,75 507,138"/>
      <!-- 성벽 -->
      <rect x="180" y="210" width="440" height="90"/>
      <path d="M180 210 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h16 v-12 h16 v12 h8 v10 h-440z"/>
      <!-- 바깥 언덕 -->
      <path d="M0 300 C120 250 220 262 320 280 C420 262 560 250 800 290 V300 Z"/>
    </g>
    <!-- 창문 -->
    <rect class="win" x="392" y="130" width="16" height="24" rx="8"/>
    <rect class="win" x="392" y="180" width="16" height="22" rx="8" style="animation-delay:1s"/>
    <rect class="win" x="231" y="175" width="12" height="18" rx="6" style="animation-delay:.5s"/>
    <rect class="win" x="557" y="175" width="12" height="18" rx="6" style="animation-delay:1.5s"/>
    <rect class="win" x="312" y="165" width="12" height="16" rx="6" style="animation-delay:2s"/>
    <rect class="win" x="476" y="165" width="12" height="16" rx="6" style="animation-delay:2.5s"/>
    <path class="win" d="M384 300 v-34 a16 16 0 0 1 32 0 v34z" style="opacity:.55"/>
  </svg>
</div>

<main class="stage" id="stage">
  <div class="bubble" role="status">
    <span class="spark a">✨</span><span class="spark b">⭐</span><span class="spark c">✨</span>
    <b>이은솔</b>님에게 편지가 왔어요! 💌
    <small>편지를 눌러 확인하세요!</small>
  </div>

  <button class="envelope-wrap" id="envelope" aria-label="편지 열기">
    <div class="envelope">
      <div class="env-back"></div>
      <div class="letter">
        <p class="to">사랑하는 은솔에게</p>
        <p class="hb">Happy Birthday</p>
        <p class="heart">💖</p>
      </div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal">♥</div>
    </div>
  </button>

  <p class="tap-hint">👆 톡 눌러보세요</p>
</main>

<section class="movie" id="movie" aria-hidden="true">
  <h1>Happy Birthday<span>은솔아, 생일 축하해 💖</span></h1>
  <div class="frame" id="frame">
    <video id="video" playsinline controls preload="metadata">
      <!-- 영상 파일을 public/video.mp4 로 넣으면 자동으로 재생됩니다 -->
      <source src="video.mp4" type="video/mp4">
      <source src="files/video.mp4" type="video/mp4">
    </video>
    <div class="placeholder">🎬<br>영상이 곧 도착해요!<br><small>조금만 기다려 주세요 ✨</small></div>
    <button class="play-big" id="playBig" aria-label="영상 재생">▶</button>
  </div>
  <button class="again" id="again">💌 편지 다시 보기</button>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);

  // 별
  const stars = $("stars");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("i");
    s.className = "star";
    const size = rand(1, 3.2);
    s.style.cssText = `width:${size}px;height:${size}px;left:${rand(0, 100)}vw;top:${rand(0, 62)}vh;--d:${rand(2, 5)}s;--delay:${rand(0, 4)}s`;
    stars.appendChild(s);
  }

  // 라푼젤 등불
  const lanterns = $("lanterns");
  for (let i = 0; i < 16; i++) {
    const l = document.createElement("i");
    l.className = "lantern";
    l.style.cssText = `left:${rand(2, 96)}vw;--d:${rand(14, 26)}s;--delay:${rand(-26, 0)}s;--s:${rand(.55, 1.15)};--sway:${rand(-40, 40)}px`;
    lanterns.appendChild(l);
  }

  // 영상
  const video = $("video");
  const frame = $("frame");
  const movie = $("movie");
  const stage = $("stage");
  const envelope = $("envelope");

  const sources = video.querySelectorAll("source");
  sources[sources.length - 1].addEventListener("error", () => frame.classList.add("missing"));

  function tryPlay() {
    if (frame.classList.contains("missing")) return;
    video.play().then(
      () => frame.classList.remove("needs-tap"),
      () => frame.classList.add("needs-tap")
    );
  }
  $("playBig").onclick = tryPlay;
  video.addEventListener("play", () => frame.classList.remove("needs-tap"));

  function burst(x, y) {
    const icons = ["✨", "💖", "⭐", "💫", "🌸", "💕"];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement("span");
      p.className = "burst";
      p.textContent = icons[i % icons.length];
      const ang = rand(0, Math.PI * 2), dist = rand(90, 220);
      p.style.cssText = `left:${x}px;top:${y}px;--x:${Math.cos(ang) * dist}px;--y:${Math.sin(ang) * dist}px;--r:${rand(-180, 180)}deg;--size:${rand(14, 28)}px`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1400);
    }
  }

  let opened = false;
  envelope.addEventListener("click", () => {
    if (opened) return;
    opened = true;

    // 휴대폰에서 소리 있는 재생이 막히지 않도록 터치하는 순간 미리 재생 권한을 받아둠
    if (!frame.classList.contains("missing")) {
      video.play().then(() => { video.pause(); video.currentTime = 0; }, () => {});
    }

    const r = envelope.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    envelope.classList.add("opened");
    stage.classList.add("leaving");

    setTimeout(() => {
      movie.classList.add("show");
      movie.setAttribute("aria-hidden", "false");
      tryPlay();
    }, 2700);
  });

  $("again").onclick = () => {
    video.pause();
    movie.classList.remove("show");
    movie.setAttribute("aria-hidden", "true");
    envelope.classList.remove("opened");
    stage.classList.remove("leaving");
    opened = false;
  };
})();
</script>
</body>
</html>
