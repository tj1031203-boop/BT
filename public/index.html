<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>은솔이에게 편지가 왔어요 💌</title>
<meta name="theme-color" content="#0b1250">
<meta property="og:title" content="💌 이은솔님에게 편지가 왔어요!">
<meta property="og:description" content="편지를 눌러 확인하세요 ✨">
<meta property="og:image" content="https://bt-file-server.onrender.com/castle.jpg">
<link rel="preload" as="image" href="castle.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Princess+Sofia&family=Hi+Melody&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0b1250;
    --night-deep: #050828;
    --silver-1: #ffffff;
    --silver-2: #dfe6f5;
    --silver-3: #a9b8d6;
    --glow: rgba(190, 215, 255, .85);
    --pink: #ff9ec7;
    --pink-deep: #e2638f;
    --paper: #fffaf0;
    --ink: #4b3a66;
    --env: #ffe0ec;
    --env-shade: #f8c3d7;
    --env-dark: #eda7c2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--night-deep);
    color: #fff;
    font-family: "Hi Melody", "Apple SD Gothic Neo", sans-serif;
  }

  /* 디즈니 로고처럼 은빛으로 빛나는 글씨 */
  .silver {
    background: linear-gradient(180deg, var(--silver-1) 0%, var(--silver-2) 38%, var(--silver-3) 52%, var(--silver-1) 70%, var(--silver-2) 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 6px var(--glow)) drop-shadow(0 2px 2px rgba(5, 8, 40, .6));
  }
  .script { font-family: "Princess Sofia", cursive; }

  /* ---------- 배경 ---------- */
  .scene { position: fixed; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  .scene.ready { opacity: 1; }
  .backdrop {
    position: absolute; inset: -40px; background: url(castle.jpg) center 30% / cover no-repeat;
    filter: blur(28px) brightness(.7); transform: scale(1.1);
  }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .twinkle { fill: #fff; animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s); }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  .shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(5,8,40,0) 55%, rgba(5,8,40,.55) 100%);
  }

  /* 별똥별 & 요정가루 */
  .dust {
    position: fixed; left: 0; top: 0; border-radius: 50%; pointer-events: none; z-index: 4;
    background: #fff; box-shadow: 0 0 6px 2px rgba(200,225,255,.9);
    animation: dust var(--life, 1.4s) ease-out forwards;
  }
  @keyframes dust {
    from { opacity: 1; transform: translate(var(--x), var(--y)) scale(1); }
    to { opacity: 0; transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) scale(.2); }
  }
  .comet {
    position: fixed; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    pointer-events: none; z-index: 5; opacity: 0;
    background: radial-gradient(circle, #fff 30%, rgba(210,230,255,.8) 55%, transparent 72%);
    box-shadow: 0 0 18px 8px rgba(200,225,255,.85), 0 0 50px 18px rgba(150,190,255,.45);
  }
  .comet.on { opacity: 1; }

  /* ---------- 편지 무대 ---------- */
  .stage {
    position: relative; z-index: 6; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 16px max(8vh, calc(env(safe-area-inset-bottom) + 24px)); gap: 26px;
  }

  .bubble {
    position: relative; max-width: 340px; padding: 14px 24px 16px;
    background: rgba(18, 26, 90, .38);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    border: 1.5px solid rgba(220, 232, 255, .7); border-radius: 30px;
    box-shadow: 0 0 22px rgba(170, 200, 255, .45), inset 0 0 18px rgba(200, 220, 255, .18);
    text-align: center; line-height: 1.25;
    opacity: 0; transform: translateY(14px) scale(.6); pointer-events: none;
  }
  .bubble .main { font-size: 27px; display: block; }
  .bubble .sub { font-size: 20px; display: block; margin-top: 4px; color: #ffe3f0; text-shadow: 0 0 8px rgba(255,158,199,.8); }
  .bubble::before, .bubble::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%); border-style: solid;
  }
  .bubble::before { bottom: -16px; border-width: 16px 13px 0; border-color: rgba(220,232,255,.7) transparent transparent; }
  .bubble::after  { bottom: -13px; border-width: 14px 11px 0; border-color: rgba(30, 40, 110, .9) transparent transparent; }
  .bubble .spark { position: absolute; font-size: 17px; animation: twinkle 1.8s ease-in-out infinite; }
  .bubble .spark.a { top: -11px; left: -4px; }
  .bubble .spark.b { top: -13px; right: -2px; animation-delay: .6s; }
  .arrived .bubble {
    opacity: 1; transform: none; pointer-events: auto;
    transition: opacity .6s ease .35s, transform .7s cubic-bezier(.2,1.6,.4,1) .35s;
    animation: bob 2.8s ease-in-out 1.2s infinite;
  }
  @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -7px; } }

  /* ---------- 봉투 ---------- */
  .envelope-wrap {
    position: relative; cursor: pointer; border: 0; background: none;
    filter: drop-shadow(0 16px 24px rgba(5,8,40,.6));
    opacity: 0; transform: scale(.15); pointer-events: none;
  }
  .arrived .envelope-wrap {
    opacity: 1; transform: none; pointer-events: auto;
    transition: opacity .4s ease, transform .9s cubic-bezier(.2,1.5,.4,1);
    animation: float 3.4s ease-in-out .9s infinite;
  }
  .envelope-wrap:focus-visible { outline: 2px dashed #fff; outline-offset: 10px; border-radius: 12px; }
  @keyframes float { 0%,100% { translate: 0 0; rotate: -2deg; } 50% { translate: 0 -10px; rotate: 2deg; } }
  .envelope-wrap::before {
    content: ""; position: absolute; inset: -34px; border-radius: 50%; z-index: -1;
    background: radial-gradient(closest-side, rgba(200,225,255,.5), transparent);
    animation: twinkle 2.6s ease-in-out infinite;
  }

  .envelope { position: relative; width: min(270px, 72vw); aspect-ratio: 3 / 2; perspective: 900px; }
  .env-back { position: absolute; inset: 0; border-radius: 10px; background: linear-gradient(160deg, var(--env-shade), var(--env-dark)); }
  .letter {
    position: absolute; left: 7%; right: 7%; top: 8%; height: 86%; z-index: 1;
    background: repeating-linear-gradient(180deg, transparent 0 22px, rgba(226,99,143,.14) 22px 23px), var(--paper);
    border-radius: 6px; color: var(--ink); text-align: center; padding: 12px 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    transition: transform 1s cubic-bezier(.3,1.3,.5,1) .55s;
  }
  .letter .to { font-size: 21px; }
  .letter .hb { font-family: "Princess Sofia", cursive; font-size: 25px; color: var(--pink-deep); margin-top: 4px; }
  .letter .heart { font-size: 18px; margin-top: 2px; }
  .env-front {
    position: absolute; inset: 0; border-radius: 0 0 10px 10px; z-index: 2;
    background: linear-gradient(180deg, var(--env), var(--env-shade));
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 62%; z-index: 3;
    background: linear-gradient(180deg, #fff0f6, var(--env));
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform .7s ease-in-out, z-index 0s .35s;
  }
  .seal {
    position: absolute; left: 50%; top: 62%; z-index: 4;
    width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    display: grid; place-items: center; font-size: 21px; color: #fff;
    background: radial-gradient(circle at 35% 30%, #ff8fb4, #d6336c 70%);
    box-shadow: 0 0 0 4px rgba(214,51,108,.35), 0 4px 10px rgba(0,0,0,.25);
    transition: transform .4s ease, opacity .4s ease;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { scale: 1; } 50% { scale: 1.1; } }

  .tap-hint { font-size: 19px; opacity: 0; }
  .arrived .tap-hint { opacity: 1; transition: opacity .8s ease 1.2s; animation: hint 2s ease-in-out 2s infinite; }
  @keyframes hint { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* 열렸을 때 */
  .opened .env-flap { transform: rotateX(180deg); z-index: 0; }
  .opened .seal { transform: scale(0) rotate(90deg); opacity: 0; animation: none; }
  .opened .letter { transform: translateY(-62%); }
  .arrived .envelope-wrap.opened { animation: none; cursor: default; }
  .stage.leaving .bubble, .stage.leaving .tap-hint { opacity: 0; transition: opacity .5s ease; animation: none; }
  .stage.leaving .envelope-wrap { transition: transform 1s ease 1.6s, opacity 1s ease 1.6s; transform: scale(1.25); opacity: 0; }

  /* ---------- 영상 화면 ---------- */
  .movie {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 24px 16px;
    opacity: 0; visibility: hidden; transition: opacity 1.2s ease, visibility 0s 1.2s;
  }
  .movie::before {
    content: ""; position: absolute; inset: -40px; z-index: -1;
    background: linear-gradient(rgba(5,8,40,.55), rgba(5,8,40,.8)), url(castle.jpg) center 35% / cover no-repeat;
    filter: blur(8px);
  }
  .movie.show { opacity: 1; visibility: visible; transition: opacity 1.2s ease; }
  .movie h1 { text-align: center; font-weight: normal; line-height: 1.05; }
  .movie h1 .script { display: block; font-size: clamp(46px, 13vw, 84px); }
  .movie h1 .ko { display: block; font-size: clamp(26px, 7vw, 38px); margin-top: 4px; }
  .frame {
    position: relative; width: min(720px, 100%); border-radius: 20px; padding: 3px;
    background: linear-gradient(135deg, #fff, var(--silver-3), #fff, var(--silver-3));
    box-shadow: 0 0 26px rgba(190,215,255,.6), 0 20px 50px rgba(0,0,0,.5);
  }
  .frame video, .frame .placeholder { display: block; width: 100%; max-height: 64vh; border-radius: 17px; background: #070b33; }
  .frame .placeholder {
    aspect-ratio: 16 / 9; display: none; place-items: center; text-align: center;
    font-size: 24px; color: #e6edff; padding: 20px; line-height: 1.5;
  }
  .frame.missing video { display: none; }
  .frame.missing .placeholder { display: grid; }
  .play-big {
    position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,.92); color: var(--night); font-size: 34px; cursor: pointer;
    box-shadow: 0 0 0 8px rgba(255,255,255,.25), 0 0 30px rgba(190,215,255,.8); display: none; padding-left: 6px;
  }
  .frame.needs-tap .play-big { display: block; }
  .again {
    font-family: inherit; font-size: 21px; color: #fff; cursor: pointer;
    background: rgba(18, 26, 90, .55); border: 1.5px solid rgba(220,232,255,.7); border-radius: 999px; padding: 8px 22px;
    box-shadow: 0 0 16px rgba(170,200,255,.4);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="scene" id="scene" aria-hidden="true">
  <div class="backdrop"></div>
  <!-- 배경 그림과 별똥별 경로가 같은 좌표(1200×2046)를 쓰도록 하나의 SVG에 넣음 -->
  <svg id="sky" viewBox="0 0 1200 2046" preserveAspectRatio="xMidYMid slice">
    <image href="castle.jpg" width="1200" height="2046"/>
    <g id="twinkles"></g>
    <path id="arc" d="M5 1050 C 40 700, 420 520, 640 560 C 860 600, 980 690, 1040 752" fill="none" stroke="none"/>
  </svg>
  <div class="shade"></div>
</div>
<div class="comet" id="comet"></div>

<main class="stage" id="stage">
  <div class="bubble" role="status">
    <span class="spark a">✨</span><span class="spark b">✨</span>
    <span class="main silver">이은솔님에게 편지가 왔어요!</span>
    <span class="sub">편지를 눌러 확인하세요 💌</span>
  </div>

  <button class="envelope-wrap" id="envelope" aria-label="편지 열기">
    <div class="envelope">
      <div class="env-back"></div>
      <div class="letter">
        <p class="to">사랑하는 은솔에게</p>
        <p class="hb">Happy Birthday</p>
        <p class="heart">💖</p>
      </div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal">♥</div>
    </div>
  </button>

  <p class="tap-hint silver">톡 눌러보세요</p>
</main>

<section class="movie" id="movie" aria-hidden="true">
  <h1>
    <span class="script silver">Happy Birthday</span>
    <span class="ko"><span class="silver">자기야, 생일 축하해</span> 💖</span>
  </h1>
  <div class="frame" id="frame">
    <!-- preload=auto: the video buffers while the shooting-star intro plays, so it starts without a wait -->
    <video id="video" playsinline webkit-playsinline controls preload="auto" poster="poster.jpg">
      <source src="video.mp4" type="video/mp4">
      <source src="files/video.mp4" type="video/mp4">
    </video>
    <div class="placeholder">🎬<br>영상이 곧 도착해요!<br>조금만 기다려 주세요 ✨</div>
    <button class="play-big" id="playBig" aria-label="영상 재생">▶</button>
  </div>
  <button class="again" id="again">💌 편지 다시 보기</button>
</section>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const rand = (a, b) => a + Math.random() * (b - a);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const easeInOut = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const scene = $("scene"), sky = $("sky"), arc = $("arc"), comet = $("comet");
  const stage = $("stage"), envelope = $("envelope");

  // 가로 화면에서는 성이 잘리지 않도록 그림 전체를 보여주고, 남는 곳은 흐린 배경으로 채움
  function fitSky() {
    const portraitish = innerWidth / innerHeight < (1200 / 2046) * 1.6;
    sky.setAttribute("preserveAspectRatio", portraitish ? "xMidYMid slice" : "xMidYMid meet");
  }
  fitSky();
  addEventListener("resize", fitSky);

  // 반짝이는 별 (성 위쪽 하늘에만)
  const NS = "http://www.w3.org/2000/svg";
  const tw = $("twinkles");
  for (let i = 0; i < 70; i++) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("class", "twinkle");
    c.setAttribute("cx", rand(0, 1200));
    c.setAttribute("cy", rand(0, 1150));
    c.setAttribute("r", rand(1.2, 3.4));
    c.style.cssText = `--d:${rand(1.8, 4.5)}s;--delay:${rand(0, 4)}s`;
    tw.appendChild(c);
  }

  function svgToScreen(x, y) {
    const p = sky.createSVGPoint();
    p.x = x; p.y = y;
    const s = p.matrixTransform(sky.getScreenCTM());
    return { x: s.x, y: s.y };
  }

  function dust(x, y, spread = 1) {
    const d = document.createElement("i");
    d.className = "dust";
    const size = rand(1.5, 4);
    d.style.cssText = `width:${size}px;height:${size}px;--x:${x}px;--y:${y}px;--dx:${rand(-14, 14) * spread}px;--dy:${rand(10, 46) * spread}px;--life:${rand(.9, 1.8)}s`;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1900);
  }

  function tween(ms, onFrame) {
    return new Promise((done) => {
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / ms);
        onFrame(t);
        t < 1 ? requestAnimationFrame(step) : done();
      };
      requestAnimationFrame(step);
    });
  }

  function placeComet(p) {
    comet.style.transform = `translate(${p.x}px, ${p.y}px)`;
  }

  function burst(x, y, count = 26) {
    for (let i = 0; i < count; i++) {
      const d = document.createElement("i");
      d.className = "dust";
      const size = rand(2, 5), ang = rand(0, Math.PI * 2), dist = rand(40, 150);
      d.style.cssText = `width:${size}px;height:${size}px;--x:${x}px;--y:${y}px;--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist}px;--life:${rand(.8, 1.5)}s`;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 1600);
    }
  }

  async function intro() {
    await wait(200);
    scene.classList.add("ready");
    if (reduceMotion) { stage.classList.add("arrived"); return; }
    await wait(1100);

    // 1) 별똥별이 성 위로 아치를 그리며 날아감
    const L = arc.getTotalLength();
    comet.classList.add("on");
    await tween(2600, (t) => {
      const pt = arc.getPointAtLength(easeInOut(t) * L);
      const s = svgToScreen(pt.x, pt.y);
      placeComet(s);
      for (let k = 0; k < 3; k++) dust(s.x + rand(-4, 4), s.y + rand(-4, 4));
    });

    // 2) 끝에서 반짝 빛나고, 편지가 놓일 자리로 내려옴
    const end = arc.getPointAtLength(L);
    const from = svgToScreen(end.x, end.y);
    burst(from.x, from.y, 14);
    await wait(150);
    const r = envelope.getBoundingClientRect();
    const to = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    const ctrl = { x: from.x + (to.x - from.x) * .2, y: to.y - (to.y - from.y) * .1 };
    await tween(1100, (t) => {
      const e = t * t;
      const x = (1 - e) * (1 - e) * from.x + 2 * (1 - e) * e * ctrl.x + e * e * to.x;
      const y = (1 - e) * (1 - e) * from.y + 2 * (1 - e) * e * ctrl.y + e * e * to.y;
      placeComet({ x, y });
      for (let k = 0; k < 3; k++) dust(x + rand(-5, 5), y + rand(-5, 5), .6);
    });

    // 3) 펑! 하고 편지 등장
    comet.classList.remove("on");
    burst(to.x, to.y, 34);
    stage.classList.add("arrived");
  }
  intro();

  // ---------- 영상 ----------
  const video = $("video"), frame = $("frame"), movie = $("movie");
  const sources = video.querySelectorAll("source");
  // 영상 파일이 아직 없으면 안내 문구를 보여줌
  const checkMissing = () => {
    if (video.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) frame.classList.add("missing");
  };
  sources[sources.length - 1].addEventListener("error", () => frame.classList.add("missing"));
  checkMissing();

  function tryPlay() {
    checkMissing();
    if (frame.classList.contains("missing")) return;
    video.play().then(
      () => frame.classList.remove("needs-tap"),
      () => { checkMissing(); frame.classList.add("needs-tap"); }
    );
  }
  $("playBig").onclick = tryPlay;
  video.addEventListener("play", () => frame.classList.remove("needs-tap"));

  let opened = false;
  envelope.addEventListener("click", () => {
    if (opened || !stage.classList.contains("arrived")) return;
    opened = true;

    // 휴대폰에서 소리 있는 재생이 막히지 않도록 터치하는 순간 미리 재생 권한을 받아둠
    if (!frame.classList.contains("missing")) {
      video.play().then(() => { video.pause(); video.currentTime = 0; }, () => {});
    }

    const r = envelope.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 40);
    envelope.classList.add("opened");
    stage.classList.add("leaving");

    setTimeout(() => {
      movie.classList.add("show");
      movie.setAttribute("aria-hidden", "false");
      tryPlay();
    }, 2700);
  });

  $("again").onclick = () => {
    video.pause();
    movie.classList.remove("show");
    movie.setAttribute("aria-hidden", "true");
    envelope.classList.remove("opened");
    stage.classList.remove("leaving");
    opened = false;
  };
})();
</script>
</body>
</html>
